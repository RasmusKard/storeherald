name: Release

# Merging release-please's PR tags the version, creates the GitHub release and publishes the docs.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Holds the App key; limited to main.
    environment: release
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PR opened with GITHUB_TOKEN would not trigger CI on the release PR, and only the App may create v* tags.
      - id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  pages:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.release-please.outputs.tag }}
